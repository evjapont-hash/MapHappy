name: Web player

# Publishes web/ (the player and the show in web/show/) to GitHub Pages, so anyone can watch the show at
#   https://<your-user-name>.github.io/MapHappy/
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  actions: read          # deploy-pages looks up the uploaded artifact through the Actions API
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the shaders match the desktop app
        run: node web/tools/extract-shaders.mjs --check
      - name: Pages is set up for this repository
        uses: actions/configure-pages@v5            # fails with a clear message if Settings > Pages isn't set to "GitHub Actions"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      # GitHub sometimes can't find the upload yet, or answers "try again later": wait and try again (3 tries in all)
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
